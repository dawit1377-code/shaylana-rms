<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173c35"><title>Shayalana RMS</title>
<style>
:root{--g:#173c35;--g2:#285c4e;--mint:#e8f1eb;--gold:#c9a66b;--bg:#f5f7f5;--ink:#1c2924;--muted:#68756f;--line:#dfe6e1;--red:#a33c32}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:650;background:var(--g);color:white}button.alt{background:white;color:var(--g);border:1px solid var(--line)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:white}label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 5px}.top{background:var(--g);color:white;padding:15px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:11px}.logo{background:var(--gold);color:var(--g);font-weight:900;font-size:21px;width:42px;height:42px;border-radius:13px;display:grid;place-items:center}.brand h1{font-size:17px;margin:0}.brand p{margin:2px 0 0;font-size:12px;color:#d5e3dc}.layout{display:grid;grid-template-columns:215px minmax(0,1fr);min-height:calc(100vh - 72px);max-width:1500px;margin:auto}aside{padding:20px 12px;background:white;border-right:1px solid var(--line)}.nav{display:grid;gap:6px}.nav button{text-align:left;background:transparent;color:#59675f}.nav button.active{background:var(--mint);color:var(--g)}main{padding:25px;min-width:0}.head{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:20px}.head h2{margin:0;font-size:25px;color:var(--g)}.head p{margin:4px 0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:15px}.statlabel{font-size:12px;color:var(--muted);font-weight:650}.statnum{font-size:24px;font-weight:800;color:var(--g);margin-top:6px}.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{max-width:350px}.wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:white}table{border-collapse:collapse;width:100%;min-width:580px}th,td{padding:12px 14px;border-bottom:1px solid #edf0ed;text-align:left;font-size:13px}th{font-size:11px;color:var(--muted);text-transform:uppercase;background:#fafbf9}tr:last-child td{border:0}.pill{display:inline-block;border-radius:99px;padding:4px 8px;background:var(--mint);color:var(--g);font-size:11px;font-weight:750}.muted{color:var(--muted)}.notice{padding:12px 14px;background:var(--mint);color:var(--g);border-radius:10px;margin:10px 0;font-size:13px}.err{background:#fff0ed;color:var(--red)}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at top left,#dcebe2,transparent 55%),var(--bg)}.loginbox{width:min(440px,100%);padding:28px;background:white;border:1px solid var(--line);border-radius:20px;box-shadow:0 15px 50px #193d2b12}.loginbox h2{color:var(--g);margin:20px 0 5px;font-size:25px}.loginbox p{color:var(--muted)}.loginbox button{width:100%;margin-top:16px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.empty{text-align:center;padding:28px;color:var(--muted)}.small{padding:6px 9px;font-size:12px}.footer{font-size:11px;color:var(--muted);margin-top:16px}.loading{text-align:center;padding:50px;color:var(--muted)}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);padding:8px;overflow:auto}.nav{display:flex;min-width:max-content}.nav button{padding:9px 11px}main{padding:16px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.top{padding:12px 14px}.email{display:none}}@media(max-width:480px){.stats{gap:8px}.card{padding:12px}.statnum{font-size:20px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.head h2{font-size:21px}}
</style></head><body><div id="app"><div class="loading">Loading Shayalana RMS…</div></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://ptijoofwagjqedmollit.supabase.co','sb_publishable_fSuYIyI2AJ9iV2PYja392A_YxeqgcmJ',{auth:{persistSession:true,autoRefreshToken:true}});
const $=s=>document.querySelector(s), esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=v=>new Intl.NumberFormat('en-ET',{style:'currency',currency:'ETB',maximumFractionDigits:2}).format(Number(v||0));
let user=null,profile=null,restaurant=null,section='overview',cats=[],items=[];
function note(msg,bad){const n=$('#notice');if(n){n.textContent=msg;n.className='notice'+(bad?' err':'');n.classList.remove('hidden')}}
function login(msg){$('#app').innerHTML='<div class="login"><form class="loginbox" id="login"><div class="brand"><div class="logo">S</div><div><h1 style="margin:0;color:var(--g)">SHAYALANA</h1><p style="margin:2px 0">Cafe & Restaurant · RMS</p></div></div><h2>Welcome back</h2><p>Sign in to your restaurant workspace.</p><div id="notice" class="notice '+(msg?'err':'hidden')+'">'+esc(msg||'')+'</div><label>Email address</label><input id="email" type="email" autocomplete="username" required placeholder="Admin email"><label>Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Your password"><button id="submit">Sign in securely</button><p style="font-size:12px">Only authorized accounts can access this workspace. Staff PIN login is not enabled until its secure backend is implemented.</p></form></div>';$('#login').onsubmit=async e=>{e.preventDefault();const b=$('#submit');b.disabled=true;b.textContent='Signing in…';const r=await db.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(r.error){b.disabled=false;b.textContent='Sign in securely';note(r.error.message,true)}else start()}}
const sections=[['overview','Overview'],['orders','Orders & bills'],['menu','Menu management'],['tables','Dining tables'],['staff','Staff & roles'],['inventory','Inventory'],['reports','Reports']];
async function start(){const x=await db.auth.getUser();user=x.data.user;if(!user){login();return}const p=await db.from('staff_members').select('restaurant_id,display_name,role,active').eq('user_id',user.id).eq('active',true).limit(1).maybeSingle();if(p.error||!p.data){await db.auth.signOut();login('This account has no active Shayalana staff role. Ask the owner to configure access.');return}profile=p.data;const r=await db.from('restaurants').select('id,name,slug,currency').eq('id',profile.restaurant_id).maybeSingle();restaurant=r.data;if(!restaurant){login('No restaurant is linked to this account.');return}shell();await render()}
function shell(){$('#app').innerHTML='<header class="top"><div class="brand"><div class="logo">S</div><div><h1>Shayalana RMS</h1><p>Cafe & Restaurant · ETB · Addis Ababa</p></div></div><div class="actions"><span class="email">'+esc(user.email||'Admin')+'</span><button class="alt" id="out">Sign out</button></div></header><div class="layout"><aside><nav class="nav">'+sections.map(s=>'<button data-nav="'+s[0]+'" class="'+(section===s[0]?'active':'')+'">'+s[1]+'</button>').join('')+'</nav><div class="footer">Signed in as '+esc(profile.role)+'</div></aside><main><div id="notice" class="notice hidden"></div><div id="content"><div class="loading">Loading workspace…</div></div></main></div>';document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{section=b.dataset.nav;shell();render()});$('#out').onclick=async()=>{await db.auth.signOut();login()}}
async function load(table,select,order){const r=await db.from(table).select(select||'*').eq('restaurant_id',restaurant.id).order(order||'created_at',{ascending:false}).limit(300);if(r.error)throw r.error;return r.data||[]}
function head(title,sub,buttons){return '<div class="head"><div><h2>'+esc(title)+'</h2><p>'+esc(sub)+'</p></div><div class="actions">'+(buttons||'')+'</div></div>'}
function stat(label,value,detail){return '<div class="card"><div class="statlabel">'+esc(label)+'</div><div class="statnum">'+esc(value)+'</div><div class="muted" style="font-size:11px">'+esc(detail||'')+'</div></div>'}
function table(headers,rows,empty){return '<div class="wrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+(rows.length?rows.join(''):'<tr><td colspan="'+headers.length+'"><div class="empty">'+esc(empty||'No records yet.')+'</div></td></tr>')+'</tbody></table></div>'}
async function render(){const c=$('#content');c.innerHTML='<div class="loading">Loading records…</div>';try{
if(section==='overview'){const data=await Promise.all([load('orders','id,order_number,order_type,status,created_at'),load('bills','id,status,total,opened_at,closed_at'),load('menu_items','id,name,price,available,created_at'),load('menu_categories','id,name,active,sort_order,created_at','sort_order')]);const orders=data[0],bills=data[1];items=data[2];cats=data[3];const today=new Date().toDateString(),tod=orders.filter(o=>new Date(o.created_at).toDateString()===today).length,total=bills.filter(b=>b.status==='closed'&&new Date(b.closed_at||b.opened_at).toDateString()===today).reduce((s,b)=>s+Number(b.total||0),0);c.innerHTML=head('Overview','A clear view of restaurant operations')+'<div class="stats">'+stat("Today's orders",tod,'Orders created today')+stat('Open bills',bills.filter(b=>b.status==='open').length,'Awaiting cashier closure')+stat("Today's closed bills",money(total),'Closed bill totals · ETB')+stat('Active menu items',items.filter(i=>i.available).length,'Across '+cats.length+' categories')+'</div><div class="card"><h3>Quick actions</h3><div class="actions"><button data-jump="orders">Orders & bills</button><button class="alt" data-jump="menu">Manage menu</button><button class="alt" data-jump="staff">Staff & roles</button></div></div><div class="card"><h3>Latest orders</h3>'+table(['Order','Type','Status','Created'],orders.slice(0,8).map(o=>'<tr><td><b>ORD-'+esc(o.order_number)+'</b></td><td>'+esc(o.order_type)+'</td><td><span class="pill">'+esc(o.status)+'</span></td><td>'+esc(new Date(o.created_at).toLocaleString())+'</td></tr>'),'Orders will appear here.')+'</div><p class="footer">Financial totals are diagnostic until payment reconciliation and shift-close workflows are completed.</p>';document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{section=b.dataset.jump;shell();render()})}
else if(section==='menu'){const d=await Promise.all([load('menu_categories','id,name,active,sort_order,created_at','sort_order'),load('menu_items','id,category_id,name,description,price,available,created_at')]);cats=d[0];items=d[1];c.innerHTML=head('Menu management','Edit menu categories, names, and prices.','<button id="addcat">+ Category</button><button id="additem">+ Menu item</button>')+'<div class="toolbar"><input id="search" placeholder="Search items…"><select id="filter" style="max-width:220px"><option value="">All categories</option>'+cats.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('')+'</select></div><div id="menutable"></div><div id="form"></div>';function draw(){const term=$('#search').value.toLowerCase(),cat=$('#filter').value;const arr=items.filter(i=>(i.name+' '+(i.description||'')).toLowerCase().includes(term)&&(!cat||i.category_id===cat));$('#menutable').innerHTML=table(['Item','Category','Price','Availability','Actions'],arr.map(i=>'<tr><td><b>'+esc(i.name)+'</b><div class="muted">'+esc(i.description||'')+'</div></td><td>'+esc((cats.find(x=>x.id===i.category_id)||{}).name||'—')+'</td><td>'+money(i.price)+'</td><td><span class="pill">'+(i.available?'Available':'Unavailable')+'</span></td><td><button class="alt small" data-edit="'+i.id+'">Edit</button> <button class="alt small" data-enable="'+i.id+'">'+(i.available?'Disable':'Enable')+'</button></td></tr>'),'No menu items yet.');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>itemForm(items.find(i=>i.id===b.dataset.edit)));document.querySelectorAll('[data-enable]').forEach(b=>b.onclick=async()=>{const i=items.find(x=>x.id===b.dataset.enable),r=await db.from('menu_items').update({available:!i.available}).eq('id',i.id).eq('restaurant_id',restaurant.id);if(r.error)note(r.error.message,true);else render()})}$('#search').oninput=draw;$('#filter').onchange=draw;draw();$('#addcat').onclick=()=>categoryForm();$('#additem').onclick=()=>itemForm(null)}
else if(section==='orders'){const d=await Promise.all([load('orders'),load('bills')]);c.innerHTML=head('Orders & bills','Existing order and bill records.','<button id="neworder">+ New order</button>')+'<div class="notice">Read-only inspection for orders and bills in this initial build. Do not use this version to collect payments or close live bills until transaction-safe workflows are implemented.</div>'+table(['Order','Type','Status','Table ID','Created'],d[0].map(o=>'<tr><td><b>ORD-'+esc(o.order_number)+'</b></td><td>'+esc(o.order_type)+'</td><td><span class="pill">'+esc(o.status)+'</span></td><td>'+esc(o.table_id||'—')+'</td><td>'+esc(new Date(o.created_at).toLocaleString())+'</td></tr>'),'No orders yet.')+'<div class="card"><h3>Bills</h3>'+table(['Order ID','Status','Subtotal','Total','Opened'],d[1].map(b=>'<tr><td>'+esc(b.order_id)+'</td><td>'+esc(b.status)+'</td><td>'+money(b.subtotal)+'</td><td>'+money(b.total)+'</td><td>'+esc(new Date(b.opened_at).toLocaleString())+'</td></tr>'),'No bills yet.')+'</div>';$('#neworder').onclick=()=>note('Order creation is being held until atomic order and bill functions are implemented.')}
else if(section==='tables'){const rows=await load('dining_tables','id,table_name,active');c.innerHTML=head('Dining tables','Set up and maintain table names.','<button id="addtable">+ Add table</button>')+table(['Table','Status','Actions'],rows.map(t=>'<tr><td><b>'+esc(t.table_name)+'</b></td><td><span class="pill">'+(t.active?'Active':'Inactive')+'</span></td><td><button class="alt small" data-rename="'+t.id+'">Rename</button> <button class="alt small" data-switch="'+t.id+'">'+(t.active?'Disable':'Enable')+'</button></td></tr>'),'No dining tables yet.')+'<div id="tableform"></div>';function tf(t){$('#tableform').innerHTML='<div class="card"><form id="tf"><label>Table name / number</label><input id="tn" required value="'+esc(t?t.table_name:'')+'"><div class="actions"><button>Save table</button><button type="button" class="alt" id="cancel">Cancel</button></div></form></div>';$('#cancel').onclick=()=>$('#tableform').innerHTML='';$('#tf').onsubmit=async e=>{e.preventDefault();const p={restaurant_id:restaurant.id,table_name:$('#tn').value.trim(),active:true},q=t?db.from('dining_tables').update(p).eq('id',t.id).eq('restaurant_id',restaurant.id):db.from('dining_tables').insert(p),r=await q;if(r.error)note(r.error.message,true);else render()}}$('#addtable').onclick=()=>tf(null);document.querySelectorAll('[data-rename]').forEach(b=>b.onclick=()=>tf(rows.find(t=>t.id===b.dataset.rename)));document.querySelectorAll('[data-switch]').forEach(b=>b.onclick=async()=>{const t=rows.find(x=>x.id===b.dataset.switch),r=await db.from('dining_tables').update({active:!t.active}).eq('id',t.id).eq('restaurant_id',restaurant.id);if(r.error)note(r.error.message,true);else render()})}
else if(section==='staff'){const r=await db.from('staff_members').select('id,display_name,role,active,user_id,created_at').eq('restaurant_id',restaurant.id).order('created_at');if(r.error)throw r.error;c.innerHTML=head('Staff & roles','Current Supabase-authenticated staff accounts.')+'<div class="notice">Staff ID + PIN authentication needs a dedicated server-side function with rate limits and lockout. It is not enabled in this build.</div>'+table(['Name','Role','Account ID','Status'],r.data.map(s=>'<tr><td><b>'+esc(s.display_name)+'</b></td><td>'+esc(s.role)+'</td><td style="font-size:11px">'+esc(s.user_id)+'</td><td><span class="pill">'+(s.active?'Active':'Disabled')+'</span></td></tr>'),'No staff records.')+'<p class="muted">Assigning arbitrary accounts and changing roles will be added after permission testing.</p>'}
else if(section==='inventory'){const d=await Promise.all([load('ingredients','id,name,unit,quantity_on_hand,low_stock_threshold,active,created_at'),load('stock_movements','id,ingredient_id,movement_type,quantity_change,reason,created_at')]);c.innerHTML=head('Inventory','Ingredients and stock ledger. Recipe-based deduction is not enabled.','<button id="adding">+ Ingredient</button>')+'<div class="stats">'+stat('Ingredients',d[0].length,'Tracked items')+stat('Low stock',d[0].filter(i=>Number(i.quantity_on_hand)<=Number(i.low_stock_threshold)).length,'At or below threshold')+'</div>'+table(['Ingredient','Unit','On hand','Threshold','Status'],d[0].map(i=>'<tr><td><b>'+esc(i.name)+'</b></td><td>'+esc(i.unit)+'</td><td>'+esc(i.quantity_on_hand)+'</td><td>'+esc(i.low_stock_threshold)+'</td><td><span class="pill">'+(Number(i.quantity_on_hand)<=Number(i.low_stock_threshold)?'Low stock':i.active?'Active':'Inactive')+'</span></td></tr>'),'No ingredients yet.')+'<div id="ingform"></div><div class="card"><h3>Recent stock movements</h3>'+table(['Ingredient','Movement','Change','Reason','Date'],d[1].slice(0,15).map(m=>'<tr><td>'+esc(m.ingredient_id)+'</td><td>'+esc(m.movement_type)+'</td><td>'+esc(m.quantity_change)+'</td><td>'+esc(m.reason||'—')+'</td><td>'+esc(new Date(m.created_at).toLocaleString())+'</td></tr>'),'No stock movements.')+'</div>';$('#adding').onclick=()=>{ $('#ingform').innerHTML='<div class="card"><form id="if" class="formgrid"><div><label>Ingredient name</label><input id="in" required></div><div><label>Unit (kg, L, pcs…)</label><input id="iu" required></div><div><label>Opening quantity</label><input id="iq" type="number" min="0" step=".001" value="0" required></div><div><label>Low-stock threshold</label><input id="il" type="number" min="0" step=".001" value="0" required></div><div class="full"><button>Save ingredient</button></div></form></div>';$('#if').onsubmit=async e=>{e.preventDefault();const x=await db.from('ingredients').insert({restaurant_id:restaurant.id,name:$('#in').value.trim(),unit:$('#iu').value.trim(),quantity_on_hand:Number($('#iq').value),low_stock_threshold:Number($('#il').value),active:true});if(x.error)note(x.error.message,true);else render()}}}
else if(section==='reports'){const d=await Promise.all([load('orders'),load('bills'),load('payments'),load('cashier_shifts')]);const total=d[2].reduce((s,p)=>s+Number(p.amount||0),0);c.innerHTML=head('Reports & reconciliation','Diagnostic totals only; not an official daily-close report.')+'<div class="stats">'+stat('Orders recorded',d[0].length,'All available records')+stat('Closed bills',d[1].filter(b=>b.status==='closed').length,'Closed status')+stat('Payments recorded',money(total),'Recorded receipts')+stat('Cashier shifts',d[3].length,'All available shifts')+'</div><div class="card"><h3>Accounting safeguards</h3><p class="muted">Sales, collections, outstanding balances, refunds, discounts, and cash on hand must be reported separately. This view is diagnostic until reconciliation and shift approval are implemented.</p><button id="csv">Export orders CSV</button></div>';$('#csv').onclick=()=>{const cols=['order_number','order_type','status','created_at'],csv=[cols.join(','),...d[0].map(o=>cols.map(k=>JSON.stringify(o[k]||'')).join(','))].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='shayalana-orders.csv';a.click();URL.revokeObjectURL(a.href)}}
}catch(e){c.innerHTML=head('Unable to load this section','A database request failed.')+'<div class="notice err">'+esc(e.message||String(e))+'</div><button id="retry">Retry</button>';$('#retry').onclick=render}}
function categoryForm(cat){const f=$('#form');f.innerHTML='<div class="card"><h3>'+(cat?'Edit':'Add')+' category</h3><form id="cf"><label>Category name</label><input id="cn" required maxlength="80" value="'+esc(cat?cat.name:'')+'"><label>Display order</label><input id="co" type="number" value="'+(cat?cat.sort_order:0)+'"><div class="actions"><button>Save category</button><button type="button" class="alt" id="cc">Cancel</button></div></form></div>';$('#cc').onclick=()=>f.innerHTML='';$('#cf').onsubmit=async e=>{e.preventDefault();const p={restaurant_id:restaurant.id,name:$('#cn').value.trim(),sort_order:Number($('#co').value||0),active:true},q=cat?db.from('menu_categories').update(p).eq('id',cat.id).eq('restaurant_id',restaurant.id):db.from('menu_categories').insert(p),r=await q;if(r.error)note(r.error.message,true);else render()}}
function itemForm(item){const f=$('#form');f.innerHTML='<div class="card"><h3>'+(item?'Edit':'Add')+' menu item</h3><form id="itf" class="formgrid"><div class="full"><label>Item name</label><input id="iname" required value="'+esc(item?item.name:'')+'"></div><div><label>Category</label><select id="icat" required><option value="">Choose category</option>'+cats.map(x=>'<option value="'+x.id+'" '+(item&&item.category_id===x.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div><div><label>Price (ETB)</label><input id="iprice" type="number" min="0" step=".01" required value="'+esc(item?item.price:'')+'"></div><div class="full"><label>Description</label><textarea id="idesc" rows="2">'+esc(item?item.description||'':'')+'</textarea></div><div class="full actions"><button>Save item</button><button type="button" class="alt" id="ic">Cancel</button></div></form></div>';$('#ic').onclick=()=>f.innerHTML='';$('#itf').onsubmit=async e=>{e.preventDefault();const p={restaurant_id:restaurant.id,name:$('#iname').value.trim(),category_id:$('#icat').value,price:Number($('#iprice').value),description:$('#idesc').value.trim()||null},q=item?db.from('menu_items').update(p).eq('id',item.id).eq('restaurant_id',restaurant.id):db.from('menu_items').insert(p),r=await q;if(r.error)note(r.error.message,true);else render()}}
let realtimeChannels=[];function connectRealtime(){for(const ch of realtimeChannels)db.removeChannel(ch);realtimeChannels=[];if(!restaurant)return;const tables=['menu_categories','menu_items','dining_tables','orders','order_items','bills','payments','cashier_shifts','ingredients','stock_movements','admin_notifications'];for(const table of tables){const ch=db.channel('rms-'+table+'-'+restaurant.id).on('postgres_changes',{event:'*',schema:'public',table,filter:'restaurant_id=eq.'+restaurant.id},()=>{if(!document.hidden)render()}).subscribe();realtimeChannels.push(ch)}}document.addEventListener('visibilitychange',()=>{if(!document.hidden&&user&&restaurant)render()});db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){user=null;login()}});await start();if(user&&restaurant)connectRealtime();
</script></body></html>
