/* Shayalana RMS — visual refinement only; application content and logic unchanged */
:root{
 --g:#123f35;--g2:#1d5b4b;--mint:#e8f4ee;--gold:#d4b477;
 --bg:#f3f6f4;--ink:#182923;--muted:#65756d;--line:#dce6df;
 --red:#a33c32;--surface:#ffffff;--shadow:0 8px 28px rgba(18,63,53,.055);
}
html{scroll-behavior:smooth}
body{background:linear-gradient(180deg,#edf4ef 0,#f5f7f5 240px);color:var(--ink);letter-spacing:.005em}
button{border-radius:10px;transition:transform .16s ease,box-shadow .16s ease,background .16s ease;box-shadow:0 2px 5px rgba(18,63,53,.08)}
button:hover{filter:brightness(1.045);box-shadow:0 5px 14px rgba(18,63,53,.14);transform:translateY(-1px)}
button:active{transform:translateY(0)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #d4b47788;outline-offset:2px}
.top{position:sticky;top:0;z-index:50;background:linear-gradient(112deg,#103b32 0%,#185446 60%,#226452 100%);box-shadow:0 5px 20px rgba(11,43,36,.16);border-bottom:1px solid #ffffff1c}
.logo{border:2px solid #e4d1a7;box-shadow:0 2px 10px #061f1930}
.layout{max-width:1680px;grid-template-columns:230px minmax(0,1fr)}
aside{background:rgba(255,255,255,.94);box-shadow:inset -1px 0 0 #dfe8e2}
.nav{gap:7px}

function showMaintenanceOverlay(state){if(!state?.is_stopped||String(profile?.role||'').toLowerCase()==='developer'){document.getElementById('system-maintenance-overlay')?.remove();return}let el=document.getElementById('system-maintenance-overlay');if(!el){el=document.createElement('div');el.id='system-maintenance-overlay';el.style.cssText='position:fixed;inset:0;z-index:999999;background:#f5f8f7;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center';document.body.appendChild(el)}el.innerHTML='<div style="max-width:560px;background:#fff;border:1px solid #dbe5e1;border-radius:18px;padding:32px;box-shadow:0 15px 45px #173c351a"><div style="font-size:42px">⏸</div><h1>System temporarily paused</h1><p>'+esc(state.message||'The system is temporarily paused by the developer. Please try again later.')+'</p><p class="muted">Your saved restaurant data has not been deleted. This page will resume automatically when the developer restores the system.</p><button id="maintenance-check" type="button">Check again</button><p class="muted" id="maintenance-status"></p></div>';document.getElementById('maintenance-check').onclick=async()=>{const s=document.getElementById('maintenance-status');s.textContent='Checking system status…';await checkSystemMaintenance();if(document.getElementById('system-maintenance-overlay'))s.textContent='System is still paused.'}}
async function checkSystemMaintenance(){if(!user)return;try{const r=await db.functions.invoke('system-control',{body:{action:'status'}});if(r.error||r.data?.error)throw new Error(r.data?.error||r.error?.message);showMaintenanceOverlay(r.data.state)}catch(e){console.warn('System status check failed:',e.message)}}
function startMaintenancePolling(){if(shaylanaMaintenanceTimer)clearInterval(shaylanaMaintenanceTimer);checkSystemMaintenance();shaylanaMaintenanceTimer=setInterval(checkSystemMaintenance,10000)}
async function runSystemHealthCheck(){const conn=$('#health-connection'),lat=$('#health-latency'),traffic=$('#health-traffic'),errors=$('#health-errors');if(!conn)return;conn.textContent='Checking…';lat.textContent='…';try{const start=performance.now(),r=await db.from('restaurants').select('id').eq('id',restaurant.id).maybeSingle(),ms=Math.round(performance.now()-start);if(r.error)throw r.error;conn.textContent='Connected';conn.style.color='#16803d';lat.textContent=ms+' ms';lat.style.color=ms<500?'#16803d':ms<1500?'#b7791f':'#b42318'}catch(e){conn.textContent='Connection issue';conn.style.color='#b42318';lat.textContent='Failed'}const entries=performance.getEntriesByType('resource');const bytes=entries.reduce((n,x)=>n+(Number(x.transferSize)||Number(x.encodedBodySize)||0),0);traffic.textContent=bytes>1048576?(bytes/1048576).toFixed(2)+' MB':Math.round(bytes/1024)+' KB';errors.textContent=String(shaylanaJsErrors)}
async function setSystemStopped(stopped){const btn=$('#system-stop'),resume=$('#system-resume'),state=$('#system-state');if(!btn||!resume||!state)return;const message=stopped?(prompt('Optional maintenance message for staff:','The system is temporarily paused for maintenance.')||'The system is temporarily paused by the developer. Please try again later.'):'System resumed.';btn.disabled=resume.disabled=true;state.textContent=stopped?'Pausing system…':'Resuming system…';try{const r=await db.functions.invoke('system-control',{body:{action:'set_stopped',is_stopped:stopped,message}});if(r.error||r.data?.error)throw new Error(r.data?.error||r.error?.message);state.textContent=stopped?'SYSTEM PAUSED · saved data preserved':'SYSTEM RUNNING · access restored';state.style.color=stopped?'#b42318':'#16803d';await checkSystemMaintenance()}catch(e){state.textContent='Could not change system state: '+(e.message||String(e));state.style.color='#b42318'}finally{btn.disabled=resume.disabled=false}}
document.addEventListener('click',e=>{const b=e.target.closest?.('#health-refresh,#system-stop,#system-resume');if(!b)return;if(b.id==='health-refresh')runSystemHealthCheck();if(b.id==='system-stop')setSystemStopped(true);if(b.id==='system-resume')setSystemStopped(false)});
const maintenanceStatusPoll=setInterval(()=>{if(profile?.role&&String(profile.role).toLowerCase()==='developer'){const s=$('#system-state');if(s&&!s.textContent.includes('PAUSED')&&!s.textContent.includes('RUNNING'))s.textContent='Developer controls are available.'}},20000);
let languageApplyQueued=false;const languageObserver=new MutationObserver(records=>{if(uiLang==='en'||languageApplyQueued||!records.some(r=>r.type==='childList'))return;languageApplyQueued=true;setTimeout(()=>{languageApplyQueued=false;applyLanguage(document)},80)});languageObserver.observe(document.getElementById('app'),{subtree:true,childList:true});
try{await Promise.race([start(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Startup timed out after 45 seconds while '+startupStage+'. The app is waiting for Supabase. Check the connection and retry.')),45000))])}catch(startError){console.error('Shayalana startup failed:',startError);const app=document.getElementById('app');if(app)app.innerHTML='<main style="max-width:720px;margin:40px auto;padding:24px"><div class="card"><h2>Workspace could not load</h2><p>The app could not finish connecting to your restaurant data. Your saved data has not been deleted.</p><div class="notice err" id="startup-error"></div><button id="startup-retry">Retry connection</button><button class="alt" id="startup-reload">Reload app</button></div></main>';const errNode=document.getElementById('startup-error');if(errNode)errNode.textContent=startError?.message||String(startError);document.getElementById('startup-retry')?.addEventListener('click',()=>location.reload());document.getElementById('startup-reload')?.addEventListener('click',()=>location.reload())}
if(String(profile?.role||'').toLowerCase()==='developer'){runSystemHealthCheck();const healthState=$('#system-state');if(healthState)healthState.textContent='System control ready.';$('#system-stop')?.addEventListener('click',()=>{});}
startMaintenancePolling();
</script></body></html>
