/* Shayalana RMS — visual refinement only; application content and logic unchanged */
:root{
 --g:#123f35;--g2:#1d5b4b;--mint:#e8f4ee;--gold:#d4b477;
 --bg:#f3f6f4;--ink:#182923;--muted:#65756d;--line:#dce6df;
 --red:#a33c32;--surface:#ffffff;--shadow:0 8px 28px rgba(18,63,53,.055);
}
html{scroll-behavior:smooth}
body{background:linear-gradient(180deg,#edf4ef 0,#f5f7f5 240px);color:var(--ink);letter-spacing:.005em}
button{border-radius:10px;transition:transform .16s ease,box-shadow .16s ease,background .16s ease;box-shadow:0 2px 5px rgba(18,63,53,.08)}
button:hover{filter:brightness(1.045);box-shadow:0 5px 14px rgba(18,63,53,.14);transform:translateY(-1px)}
button:active{transform:translateY(0)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #d4b47788;outline-offset:2px}
.top{position:sticky;top:0;z-index:50;background:linear-gradient(112deg,#103b32 0%,#185446 60%,#226452 100%);box-shadow:0 5px 20px rgba(11,43,36,.16);border-bottom:1px solid #ffffff1c}
.logo{border:2px solid #e4d1a7;box-shadow:0 2px 10px #061f1930}
.layout{max-width:1680px;grid-template-columns:230px minmax(0,1fr)}
aside{background:rgba(255,255,255,.94);box-shadow:inset -1px 0 0 #dfe8e2}
.nav{gap:7px}
.nav button{border:1px solid transparent;border-radius:10px;padding:11px 13px;transition:background .16s ease,color .16s ease,border-color .16s ease}
