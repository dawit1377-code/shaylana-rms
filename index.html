const $=s=>document.querySelector(s), esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=v=>new Intl.NumberFormat('en-ET',{style:'currency',currency:'ETB',maximumFractionDigits:2}).format(Number(v||0));

function note(msg,bad){const n=$('#notice');if(n){n.textContent=msg;n.className='notice'+(bad?' err':'');n.classList.remove('hidden')}}
function login(msg){$('#app').innerHTML='<div class="login"><form class="loginbox" id="login"><div class="brand"><div class="logo">S</div><div><h1 style="margin:0;color:var(--g)">SHAYALANA</h1><p style="margin:2px 0">Cafe & Restaurant · RMS</p></div></div><h2>Welcome back</h2><p>Sign in to your restaurant workspace.</p><div id="notice" class="notice '+(msg?'err':'hidden')+'">'+esc(msg||'')+'</div><label>User ID or admin email</label><input id="loginid" type="text" autocapitalize="none" autocomplete="username" required placeholder="Enter your User ID"><label>Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Your password"><button id="submit">Sign in securely</button><p style="font-size:12px">Only authorized accounts can access this workspace. Use the User ID and password provided by your restaurant admin. Admin email login also works.</p></form></div>';$('#login').onsubmit=async e=>{e.preventDefault();const b=$('#submit');b.disabled=true;b.textContent='Signing in…';const r=await db.auth.signInWithPassword({email:($('#loginid').value.trim().includes('@')?$('#loginid').value.trim():$('#loginid').value.trim().toLowerCase()+'@staff.shayalana.com'),password:$('#password').value});if(r.error){b.disabled=false;b.textContent='Sign in securely';note(r.error.message,true)}else start()}}
const allSections=[['overview','Overview'],['orders','Cashier'],['production','Kitchen & beverages'],['menu','Menu management'],['tables','Dining tables'],['staff','Staff & roles'],['inventory','Inventory'],['reports','Reports']];
function allowedSections(){const role=String(profile?.role||'').toLowerCase();if(['owner','admin'].includes(role))return allSections;if(role==='cashier')return [['orders','Cashier']];if(role==='supervisor')return allSections.filter(s=>['overview','orders','production','tables','inventory','reports'].includes(s[0]));if(role==='kitchen'||['hot_drinks','soft_drinks','beverage'].includes(role))return [['production','Kitchen & beverages']];if(role==='waiter')return [['orders','Orders']];return [['overview','Overview']]}
function sectionAllowed(key){return allowedSections().some(s=>s[0]===key)}
async function start(){const x=await db.auth.getUser();user=x.data.user;if(!user){login();return}const p=await db.from('staff_members').select('restaurant_id,display_name,role,active').eq('user_id',user.id).eq('active',true).limit(1).maybeSingle();if(p.error||!p.data){await db.auth.signOut();login('This account has no active Shayalana staff role. Ask the owner to configure access.');return}profile=p.data;const r=await db.from('restaurants').select('id,name,slug,currency').eq('id',profile.restaurant_id).maybeSingle();restaurant=r.data;if(!restaurant){login('No restaurant is linked to this account.');return}section=String(profile.role||'').toLowerCase()==='cashier'?'orders':allowedSections()[0]?.[0]||'overview';shell();await render();connectRealtime()}
function shell(){const displayName=profile?.display_name||profile?.role||'Staff',roleLabel=String(profile?.role||'staff').replace(/_/g,' ');$('#app').innerHTML='<header class="top"><div class="brand"><div class="logo">S</div><div><h1>Shayalana RMS</h1><p>Cafe & Restaurant · ETB · Addis Ababa</p></div></div><div class="actions"><span class="email">'+esc(displayName)+'</span><button class="alt" id="out">Sign out</button></div></header><div class="layout"><aside><nav class="nav">'+allowedSections().map(s=>'<button data-nav="'+s[0]+'" class="'+(section===s[0]?'active':'')+'">'+s[1]+'</button>').join('')+'</nav><div class="footer">Signed in as '+esc(displayName)+' · '+esc(roleLabel)+'</div></aside><main><div class="welcome-banner"><div class="welcome-mark">✦</div><div><strong>Welcome back, '+esc(displayName)+'!</strong><span>Your '+esc(roleLabel)+' workspace is ready. Have a great service today.</span></div></div><div id="notice" class="notice hidden"></div><div id="content"><div class="loading">Loading workspace…</div></div></main></div>';document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{if(!sectionAllowed(b.dataset.nav))return;section=b.dataset.nav;shell();render()});$('#out').onclick=async()=>{await db.auth.signOut();login()}}
async function load(table,select,order){let q=db.from(table).select(select||'*').eq('restaurant_id',restaurant.id);if(order)q=q.order(order,{ascending:table==='menu_categories'});const r=await q.limit(300);if(r.error)throw r.error;return r.data||[]}
