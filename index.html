const $=s=>document.querySelector(s), esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=v=>new Intl.NumberFormat('en-ET',{style:'currency',currency:'ETB',maximumFractionDigits:2}).format(Number(v||0));

async function render(){const c=$('#content');c.innerHTML='<div class="loading">Loading records…</div>';try{

else if(section==='production'){const d=await Promise.all([load('order_items','id,order_id,menu_item_id,item_name_snapshot,unit_price,quantity,status,notes,created_at','created_at'),load('menu_items','id,name,category_id','name'),load('menu_categories','id,name,sort_order','sort_order'),load('orders','id,order_number,table_id,order_type,status','created_at'),load('dining_tables','id,table_name','table_name')]);const bev=['hot drinks','soft drinks'];const role=String(profile?.role||'').toLowerCase();const rows=d[0].filter(i=>!['served','cancelled'].includes(i.status)).map(i=>{const mi=d[1].find(x=>x.id===i.menu_item_id),cat=d[2].find(x=>x.id===mi?.category_id),ord=d[3].find(x=>x.id===i.order_id),isB=bev.includes(String(cat?.name||'').toLowerCase());return {...i,cat:cat?.name||'Uncategorized',ord,table:d[4].find(t=>t.id===ord?.table_id)?.table_name||'Takeaway',station:isB?'Beverages':'Kitchen',isB}}).filter(i=>['owner','admin','supervisor'].includes(role)||(role==='kitchen'&&!i.isB)||(['beverage','hot_drinks','soft_drinks'].includes(role)&&i.isB));c.innerHTML=head('Kitchen & beverage queue','Live order preparation. Changes are checked against your staff role in the database.')+'<div class="stats">'+stat('Active items',rows.length,'Not yet served or cancelled')+stat('Kitchen',rows.filter(i=>!i.isB).length,'Food preparation')+stat('Beverages',rows.filter(i=>i.isB).length,'Juices and drinks')+'</div><div class="card"><div class="toolbar"><select id="stationfilter"><option value="">All assigned items</option><option value="Kitchen">Kitchen</option><option value="Beverages">Beverages</option></select><select id="statusfilter"><option value="">All statuses</option><option value="pending">Pending</option><option value="sent">Sent</option><option value="preparing">Preparing</option><option value="ready">Ready</option></select></div><div id="productiontable"></div></div>';function drawQueue(){const st=$('#statusfilter').value,station=$('#stationfilter').value,filtered=rows.filter(i=>(!st||i.status===st)&&(!station||i.station===station));$('#productiontable').innerHTML=table(['Order / Table','Station / Item','Qty','Status','Notes','Update'],filtered.map(i=>'<tr><td><b>ORD-'+esc(i.ord?.order_number||'—')+'</b><div class="muted">'+esc(i.table)+'</div></td><td><span class="pill">'+i.station+'</span><div><b>'+esc(i.item_name_snapshot)+'</b></div><div class="muted">'+esc(i.cat)+'</div></td><td>'+esc(i.quantity)+'</td><td><span class="pill">'+esc(i.status)+'</span></td><td>'+esc(i.notes||'—')+'</td><td><select data-itemstatus="'+i.id+'">'+['pending','sent','preparing','ready','served','cancelled'].map(s=>'<option value="'+s+'" '+(s===i.status?'selected':'')+'>'+s+'</option>').join('')+'</select><button class="small" data-saveitem="'+i.id+'">Save</button></td></tr>'),'No active kitchen or beverage items.');document.querySelectorAll('[data-saveitem]').forEach(b=>b.onclick=async()=>{const id=b.dataset.saveitem,status=$('[data-itemstatus="'+id+'"]').value;try{const r=await db.rpc('rms_update_item_status',{p_item_id:id,p_status:status});if(r.error)throw r.error;note('Order item updated: '+status);await render()}catch(e){alert('Could not update item: '+(e.message||String(e)))}})}drawQueue();$('#stationfilter').onchange=drawQueue;$('#statusfilter').onchange=drawQueue}
else if(section==='menu'){const d=await Promise.all([load('menu_categories','id,name,active,sort_order,created_at','sort_order'),load('menu_items','id,category_id,name,description,price,available,created_at')]);cats=d[0];items=d[1];c.innerHTML=head('Menu management','Edit menu categories, names, and prices.','<button id="addcat">+ Category</button><button id="additem">+ Menu item</button>')+'<div class="toolbar"><input id="search" placeholder="Search items…"><select id="filter" style="max-width:220px"><option value="">All categories</option>'+cats.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('')+'</select></div><div id="menutable"></div><div id="form"></div>';function draw(){const term=$('#search').value.toLowerCase(),cat=$('#filter').value;const arr=items.filter(i=>(i.name+' '+(i.description||'')).toLowerCase().includes(term)&&(!cat||i.category_id===cat));$('#menutable').innerHTML=table(['Item','Category','Price','Availability','Actions'],arr.map(i=>'<tr><td><b>'+esc(i.name)+'</b><div class="muted">'+esc(i.description||'')+'</div></td><td>'+esc((cats.find(x=>x.id===i.category_id)||{}).name||'—')+'</td><td>'+money(i.price)+'</td><td><span class="pill">'+(i.available?'Available':'Unavailable')+'</span></td><td><button class="alt small" data-edit="'+i.id+'">Edit</button> <button class="alt small" data-enable="'+i.id+'">'+(i.available?'Disable':'Enable')+'</button></td></tr>'),'No menu items yet.');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>itemForm(items.find(i=>i.id===b.dataset.edit)));document.querySelectorAll('[data-enable]').forEach(b=>b.onclick=async()=>{const i=items.find(x=>x.id===b.dataset.enable),r=await db.from('menu_items').update({available:!i.available}).eq('id',i.id).eq('restaurant_id',restaurant.id);if(r.error)note(r.error.message,true);else render()})}$('#search').oninput=draw;$('#filter').onchange=draw;draw();$('#addcat').onclick=()=>categoryForm();$('#additem').onclick=()=>itemForm(null)}
else if(section==='orders'){const d=await Promise.all([load('orders','id,order_number,table_id,order_type,status,created_at,cashier_shift_id'),load('bills','id,order_id,status,subtotal,discount,total,opened_at,closed_at','opened_at'),load('payments','id,bill_id,method,amount,shift_id,reference,created_at','created_at'),load('menu_items','id,name,price,available','name'),load('dining_tables','id,table_name,active','table_name')]);const paid={};d[2].forEach(p=>paid[p.bill_id]=(paid[p.bill_id]||0)+Number(p.amount||0));c.innerHTML=head('Cashier · Orders & bills','Create orders, add items to open bills, record split payments and close only fully paid bills.','<button id="neworder">+ New order</button>')+'<div id="orderwork"></div><div class="card"><h3>Orders</h3>'+table(['Order','Type','Table','Status','Created'],d[0].map(o=>'<tr><td><b>ORD-'+esc(o.order_number)+'</b></td><td>'+esc(o.order_type.replace('_',' '))+'</td><td>'+esc(d[4].find(t=>t.id===o.table_id)?.table_name||'—')+'</td><td><span class="pill">'+esc(o.status)+'</span></td><td>'+esc(new Date(o.created_at).toLocaleString())+'</td></tr>'),'No orders yet.')+'</div><div class="card"><h3>Bills & payments</h3>'+table(['Bill / order','Status','Total','Paid','Balance','Actions'],d[1].map(b=>{const p=paid[b.id]||0,bal=Math.max(0,Number(b.total)-p);return '<tr><td><b>'+esc(d[0].find(o=>o.id===b.order_id)?'ORD-'+d[0].find(o=>o.id===b.order_id).order_number:'Order')+'</b><div class="muted">'+esc(b.id.slice(0,8))+'</div></td><td><span class="pill">'+esc(b.status)+'</span></td><td>'+money(b.total)+'</td><td>'+money(p)+'</td><td><b>'+money(bal)+'</b></td><td>'+(b.status==='open'?'<div class="actions">'+(bal<0.01?'<button data-closebill="'+b.id+'">Close paid bill</button>':'')+'<button class="alt" data-addbill="'+b.id+'">Add items</button>'+(bal>=0.01?'<button class="alt" data-paybill="'+b.id+'" data-balance="'+bal+'">Record payment</button>':'')+'<button class="alt" data-receipt="'+b.id+'">Print receipt</button></div>':'<but
