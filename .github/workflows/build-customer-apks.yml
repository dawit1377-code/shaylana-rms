name: Build Shaylana customer APKs
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-native/**'
      - '.github/workflows/build-customer-apks.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing repository secret ANDROID_KEYSTORE_BASE64'; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shaylana-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/shaylana-release.jks" >> "$GITHUB_ENV"
      - name: Build seven signed release APKs
        working-directory: android-native
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD"
          gradle --no-daemon assembleBreakfastRelease assembleLunchRelease assembleDinnerRelease assembleJuicesRelease assembleHotDrinksRelease assembleSoftDrinksRelease assembleCakeRelease
      - name: Collect APKs
        run: |
          mkdir -p release-apks
          find android-native/app/build/outputs/apk -type f -name '*.apk' -path '*/release/*' -exec cp {} release-apks/ \;
          test "$(find release-apks -maxdepth 1 -name '*.apk' | wc -l)" -eq 7
      - name: Upload signed APK bundle
        uses: actions/upload-artifact@v4
        with:
          name: shaylana-seven-production-signed-apks
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 90
