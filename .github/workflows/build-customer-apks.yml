name: Build Shaylana customer APKs
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Generate temporary APK signing key
        run: |
          KEYSTORE="$RUNNER_TEMP/shaylana-temporary-release.jks"
          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt -v \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASSWORD" \
            -alias shaylana-temporary \
            -keypass "$KEY_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=Shaylana Cafe and Restaurant, OU=Customer Apps, O=Shaylana, L=Addis Ababa, ST=Addis Ababa, C=ET"
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=shaylana-temporary"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build seven signed release APKs
        working-directory: android-native
        run: |
          gradle --no-daemon assembleBreakfastRelease assembleLunchRelease assembleDinnerRelease assembleJuicesRelease assembleHotDrinksRelease assembleSoftDrinksRelease assembleCakeRelease
      - name: Collect APKs
        run: |
          mkdir -p release-apks
          find android-native/app/build/outputs/apk -type f -name '*.apk' -path '*/release/*' -exec cp {} release-apks/ \;
          test "$(find release-apks -maxdepth 1 -name '*.apk' | wc -l)" -eq 7
      - name: Upload signed APK bundle
        uses: actions/upload-artifact@v4
        with:
          name: shaylana-seven-simple-apks
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 90
